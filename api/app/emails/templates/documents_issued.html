<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>$subject</title>
  </head>
  <!-- Tables, inline styles and explicit colours: see account_ready.html for why. -->
  <body style="margin:0; padding:0; width:100%; background-color:#f4f5f9; color:#1c1d26;">
    <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#f4f5f9;">
      $preheader
    </div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f4f5f9;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:640px; background-color:#ffffff; border-radius:12px; overflow:hidden; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;">
            <tr>
              <td style="background-color:#2c2f74; padding:22px 28px; color:#ffffff; font-size:16px; font-weight:600;">$company</td>
            </tr>
            <tr>
              <td style="padding:32px 28px 8px 28px;">
                <h1 style="margin:0 0 16px 0; font-size:21px; line-height:28px; font-weight:600; color:#1c1d26;">$heading</h1>
                <p style="margin:0 0 8px 0; font-size:15px; line-height:23px; color:#3f4150;">$greeting</p>
                <p style="margin:0 0 20px 0; font-size:15px; line-height:23px; color:#3f4150;">$intro</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 8px 28px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e2e3ec; border-radius:8px; background-color:#fafbfd;">
                  <tr>
                    <td style="padding:10px 12px; font-size:12px; color:#6b6d80; text-transform:uppercase;">Number</td>
                    <td style="padding:10px 12px; font-size:12px; color:#6b6d80; text-transform:uppercase;">Details</td>
                    <td align="right" style="padding:10px 12px; font-size:12px; color:#6b6d80; text-transform:uppercase;">Amount</td>
                  </tr>
                  $rows
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 28px 30px 28px;">
                <p style="margin:0; font-size:13px; line-height:20px; color:#6b6d80;">$footer</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0 0; font-size:12px; color:#8a8c9e;">&copy; $year $company</p>
        </td>
      </tr>
    </table>
  </body>
</html>
