name: Deploy adminWeb — production

# Manual only, same reasoning as the API's prod-deploy.yml: merging to main is
# a separate human action from putting that build in front of live users.
#
# adminWeb is a Vite SPA — no server of its own. `installflowweb` is a Linux
# Node App Service, and its container boots by trying to run a generated
# `server.mjs` that Oryx (Azure's build system) creates when it builds a
# recognised frontend framework project and serves the output as static
# content. That only happens if Oryx gets a real project to build: deploying
# the pre-built `dist/` folder alone (no package.json) leaves nothing for
# Oryx to build, no server.mjs ever gets generated, and the container
# crash-loops on startup looking for a file that was never going to exist —
# every request 503s. So this deploys the whole adminWeb SOURCE tree and lets
# Azure's own Oryx build run remotely, which is what the platform already
# expects for this app.
#
# VITE_* values are baked into the bundle at BUILD time, not read at runtime
# — .env.production has to exist in the uploaded source before Oryx's remote
# `npm run build` runs, so it's written before packaging, same as before.
# `npm run build` also runs once LOCALLY first, purely as a fast, readable
# fail-fast check — a TypeScript error shows up here in seconds instead of
# buried in Azure's Oryx build log; its output is discarded before packaging.
#
# A zip deploy does NOT trigger an Oryx build on its own — that's opt-in per
# App Service via SCM_DO_BUILD_DURING_DEPLOYMENT / ENABLE_ORYX_BUILD, off by
# default. api/scripts/publish.py already knows this and flips both on before
# every api deploy; this workflow has to do the same thing explicitly rather
# than assume it, or Kudu just extracts the source into wwwroot unbuilt —
# same missing-server.mjs crash as deploying dist/ alone.
#
# Netlify (https://reliancegreentech.netlify.app) still auto-deploys from git
# — it now tracks `dev` only, this workflow is what serves production. See
# .github/DEPLOYMENT.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to proceed'
        required: true
      allow_non_main_branch:
        description: 'Allow running from a branch other than main (hotfix use only)'
        type: boolean
        default: false

concurrency:
  group: deploy-web-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminWeb
    steps:
      - uses: actions/checkout@v4

      - name: Confirm intent
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "deploy" ]; then
            echo 'Input must be exactly "deploy" — refusing.' >&2
            exit 1
          fi

      - name: Refuse to run off any ref but main, unless overridden
        env:
          ALLOW_NON_MAIN: ${{ github.event.inputs.allow_non_main_branch }}
          REF: ${{ github.ref }}
        run: |
          if [ "$ALLOW_NON_MAIN" != "true" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "This workflow only runs against main (got $REF) unless allow_non_main_branch is ticked." >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: adminWeb/.nvmrc
          cache: npm
          cache-dependency-path: adminWeb/package-lock.json

      - run: npm ci

      - name: Write production configuration
        # Same env: routing as the API workflows — ${{ }} pastes raw text
        # into the shell command before parsing; env: hands it over as an
        # already-set variable so quotes/newlines in the secret can't break
        # the write.
        env:
          CONTENT: ${{ secrets.WEB_ENV_FILE_PROD }}
        run: printf '%s' "$CONTENT" > .env.production

      - name: Build (fail-fast check only — not what gets deployed)
        run: npm run build

      - name: Strip node_modules and the local build before packaging
        # Oryx installs and builds again on the App Service itself — shipping
        # node_modules here would just bloat the upload with a copy Azure
        # throws away, and dist/ is regenerated remotely too. .env.production
        # stays; Oryx's `vite build` needs it.
        run: rm -rf node_modules dist

      - name: Enable the Oryx remote build
        # Same call api/scripts/publish.py makes before every api deploy — see
        # the comment above. Credentials come straight out of the publish
        # profile secret (its username/password are Kudu's own Basic Auth),
        # routed through env: for the same quoting reasons as everywhere else
        # in this file rather than interpolated with ${{ }}.
        env:
          PROFILE_XML: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
        run: |
          KUDU_USER=$(grep -o 'userName="[^"]*"' <<< "$PROFILE_XML" | head -1 | sed 's/userName="//;s/"$//')
          KUDU_PASS=$(grep -o 'userPWD="[^"]*"' <<< "$PROFILE_XML" | head -1 | sed 's/userPWD="//;s/"$//')
          status=$(curl -s -o /tmp/kudu-settings.out -w '%{http_code}' \
            -u "$KUDU_USER:$KUDU_PASS" \
            -X POST -H "Content-Type: application/json" \
            -d '{"SCM_DO_BUILD_DURING_DEPLOYMENT": "true", "ENABLE_ORYX_BUILD": "true"}' \
            "https://installflowweb-hhhga9gnbrc8etfx.scm.centralindia-01.azurewebsites.net/api/settings")
          cat /tmp/kudu-settings.out
          if [ "$status" != "200" ] && [ "$status" != "204" ]; then
            echo "Could not enable the remote build (HTTP $status)" >&2
            exit 1
          fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: installflowweb
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: adminWeb

      - name: Clean up secrets from the runner's disk
        if: always()
        run: rm -f .env.production
